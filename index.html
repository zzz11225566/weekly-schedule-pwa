<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="七日课表" />
    <meta name="description" content="适合大学生的七日课表，可离线使用，数据保存在本机。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>七日课表</title>
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1 1.51H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 10h18" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </symbol>
      <symbol id="i-share" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3" />
        <circle cx="6" cy="12" r="3" />
        <circle cx="18" cy="19" r="3" />
        <path d="m8.6 10.7 6.8-4.4M8.6 13.3l6.8 4.4" />
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">周</div>
          <div class="brand-copy">
            <h1>七日课表</h1>
            <p id="todayLabel">今天</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="coursesBtn" type="button" aria-label="管理课程" title="课程">
            <svg><use href="#i-list"></use></svg>
          </button>
          <button class="icon-btn" id="weekBtn" type="button" aria-label="选择周" title="周">
            <svg><use href="#i-calendar"></use></svg>
          </button>
          <button class="icon-btn" id="shareBtn" type="button" aria-label="分享给同学" title="分享">
            <svg><use href="#i-share"></use></svg>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="打开设置" title="设置">
            <svg><use href="#i-settings"></use></svg>
          </button>
        </div>
      </header>

      <nav class="day-strip" id="dayStrip" aria-label="选择星期"></nav>

      <main class="schedule-wrap">
        <section class="week-scroller" id="weekScroller" aria-label="七日日程表">
          <div class="week-grid" id="weekGrid"></div>
        </section>
      </main>
    </div>

    <div class="overlay" id="sheetOverlay" hidden>
      <section class="bottom-sheet" id="editorSheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-content" id="editorContent"></div>
      </section>
    </div>

    <div class="overlay" id="settingsOverlay" hidden>
      <section class="bottom-sheet settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="settings-head">
          <div>
            <p class="eyebrow">偏好设置</p>
            <h2 id="settingsTitle">显示与字号</h2>
          </div>
          <button class="icon-btn" id="closeSettings" type="button" aria-label="关闭设置">
            <svg><use href="#i-close"></use></svg>
          </button>
        </div>
        <div class="settings-body">
          <div class="setting-row">
            <div class="setting-copy">
              <h3>显示模式</h3>
              <p>夜间使用深灰底色与暖色提示。</p>
            </div>
            <div class="segmented" id="themeSwitch" role="group" aria-label="显示模式">
              <button type="button" data-theme="light">白天</button>
              <button type="button" data-theme="dark">夜间</button>
            </div>
          </div>
          <div class="setting-row stacked">
            <div class="setting-copy">
              <h3>字体大小</h3>
              <p>拖动到适合当前手机的阅读尺寸。</p>
            </div>
            <div class="font-control">
              <span aria-hidden="true">A</span>
              <input id="fontRange" type="range" min="0.85" max="1.25" step="0.05" value="1" />
              <span class="large" aria-hidden="true">A</span>
            </div>
          </div>
          <div class="setting-row stacked">
            <div class="setting-copy">
              <h3>界面缩放</h3>
              <p>缩小后可查看整周，放大后更适合手机编辑。</p>
            </div>
            <div class="font-control">
              <span aria-hidden="true">-</span>
              <input id="zoomRange" type="range" min="0.2" max="1.5" step="0.05" value="1" />
              <span class="large" aria-hidden="true">+</span>
            </div>
            <div class="zoom-value" id="zoomValue">100%</div>
          </div>
          <div class="setting-row">
            <div class="setting-copy">
              <h3>未安排周的课程</h3>
              <p>在课程没有安排到的周显示虚线框。</p>
            </div>
            <label class="switch-row"><input type="checkbox" id="unselectedCourses" /><span>显示虚线框</span></label>
          </div>
          <div class="setting-row">
            <div class="setting-copy">
              <h3>未安排周的待办</h3>
              <p>在待办没有安排到的周显示虚线框。</p>
            </div>
            <label class="switch-row"><input type="checkbox" id="unselectedTodos" /><span>显示虚线框</span></label>
          </div>
          <div class="settings-note">
            <span class="note-dot" aria-hidden="true"></span>
            所有内容只保存在这台设备的浏览器中，关闭 App 后仍会保留。
          </div>
        </div>
      </section>
    </div>

    <div class="overlay" id="coursesOverlay" hidden>
      <section class="bottom-sheet courses-sheet" role="dialog" aria-modal="true" aria-labelledby="coursesTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="courses-head">
          <div>
            <p class="eyebrow">课程系统</p>
            <h2 id="coursesTitle">我的课程</h2>
          </div>
          <button class="icon-btn" id="closeCourses" type="button" aria-label="关闭课程系统">
            <svg><use href="#i-close"></use></svg>
          </button>
        </div>
        <div class="courses-body" id="coursesBody"></div>
      </section>
    </div>

    <div class="overlay" id="weekOverlay" hidden>
      <section class="bottom-sheet week-sheet" role="dialog" aria-modal="true" aria-labelledby="weekTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="courses-head">
          <div>
            <p class="eyebrow">日期系统</p>
            <h2 id="weekTitle">选择周次</h2>
          </div>
          <button class="icon-btn" id="closeWeek" type="button" aria-label="关闭周次选择">
            <svg><use href="#i-close"></use></svg>
          </button>
        </div>
        <div class="week-body" id="weekBody"></div>
      </section>
    </div>

    <div class="memo-dock" id="memoDock">
      <button class="memo-handle" type="button" aria-label="展开备忘录">
        <span></span>
      </button>
      <div class="memo-panel">
        <div class="memo-title">备忘录</div>
        <textarea id="memoInput" placeholder="写点什么"></textarea>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
